name: Keep-Alive Health Ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Health Endpoint (Anti-Sleep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run keep_alive.py
        env:
          TARGET_URL: ${{ vars.TARGET_URL || 'https://triagenet-frontend.onrender.com/healthz,https://triagenet-backend.onrender.com/healthz' }}
          PING_TIMEOUT: ${{ vars.PING_TIMEOUT || '120' }}
          PING_RETRIES: ${{ vars.PING_RETRIES || '3' }}
        run: python scripts/keep_alive.py
