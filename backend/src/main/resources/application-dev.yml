server:
  port: 8080

spring:
  application:
    name: triagenet-backend
  datasource:
    url: jdbc:h2:mem:triagenet_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  # SECURITY (V3): DO NOT commit JWT secrets to version control.
  # Set JWT_SECRET environment variable instead.
  # For local dev only, generate a random secret: openssl rand -hex 32
  # secret: <set via JWT_SECRET env var>
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.triagenet: INFO
