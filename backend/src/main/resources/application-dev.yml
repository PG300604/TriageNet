server:
  port: 8080

spring:
  application:
    name: triagenet-backend
  datasource:
    url: jdbc:h2:mem:triagenet_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  # SECURITY (V3): Uses DEFAULT_DEV_SECRET fallback only in local development profile.
  # Production and staging MUST override this using JWT_SECRET env variable.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 900000
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

logging:
  level:
    root: INFO
    com.triagenet: INFO
