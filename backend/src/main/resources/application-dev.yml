server:
  port: 8080

spring:
  application:
    name: triagenet-backend
  datasource:
    url: jdbc:h2:mem:triagenet_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  # SECURITY (B1): JWT_SECRET is loaded from environment variable.
  # If unset in dev profile, an ephemeral 256-bit CSPRNG secret is generated at runtime.
  secret: ${JWT_SECRET:}
  expiration-ms: 900000
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

logging:
  level:
    root: INFO
    com.triagenet: INFO
