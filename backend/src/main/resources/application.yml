server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: triagenet-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triagenet}
    username: ${DB_USER:triagenet}
    password: ${DB_PASSWORD:triagenet_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # SECURITY (V11): Default to 'validate' in base configuration so missing env var
      # prevents unintended automatic DDL mutations against production schemas.
      # Environment-specific overrides: application-dev.yml uses 'create-drop'.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      # SECURITY (V2): H2 console disabled by default.
      # Enabled ONLY in application-dev.yml for explicit local development.
      enabled: false

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes default for access token
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

logging:
  level:
    root: INFO
    com.triagenet: DEBUG
