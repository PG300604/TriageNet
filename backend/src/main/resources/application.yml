server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: triagenet-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triagenet}
    username: ${DB_USER:triagenet}
    password: ${DB_PASSWORD:triagenet_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # SECURITY (V11): 'update' causes silent schema drift in shared envs.
      # Override per environment: dev keeps update, staging/prod must set
      # SPRING_JPA_HIBERNATE_DDL_AUTO=validate and manage migrations explicitly.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

logging:
  level:
    root: INFO
    com.triagenet: DEBUG
