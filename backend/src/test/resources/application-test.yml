spring:
  datasource:
    url: jdbc:h2:mem:triagenet_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  # SECURITY (V3): Test-only CSPRNG-generated secret for automated testing.
  # This is acceptable ONLY for automated tests and must NEVER be used in production.
  # Generated with: openssl rand -hex 32
  # Production and staging environments MUST set JWT_SECRET via environment variable.
  secret: 7a3f8d9c2e1b4a6f5c8e7d3a9b2f1c4e6a8d3b7f9e2c5a1d4f8b6e9c3a7d2b5f1
  expiration-ms: 86400000
