version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: triagenet-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-triagenet}
      POSTGRES_USER: ${DB_USER:-triagenet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-triagenet_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagenet -d triagenet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triagenet-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/triagenet
      DB_USER: triagenet
      DB_PASSWORD: triagenet_secret
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: triagenet-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
