services:
  postgres:
    image: postgres:16-alpine
    container_name: triagenet-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-triagenet}
      POSTGRES_USER: ${DB_USER:-triagenet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-triagenet} -d ${DB_NAME:-triagenet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - triagenet-network

  redis:
    image: redis:7-alpine
    container_name: triagenet-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - triagenet-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: triagenet-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-triagenet}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-triagenet}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-triagenet}
      DB_USER: ${DB_USER:-triagenet}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - triagenet-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: triagenet-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - backend
    networks:
      - triagenet-network

  nginx:
    image: nginx:alpine
    container_name: triagenet-proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - frontend
      - backend
    networks:
      - triagenet-network

volumes:
  postgres_data:
  redis_data:

networks:
  triagenet-network:
    driver: bridge
