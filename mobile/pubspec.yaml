name: triagenet_companion
description: "Unified Multi-Role Companion Mobile Application for TriageNet Emergency Healthcare"
publish_to: "none"
version: 1.2.0+120

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & Serialization
  http: ^1.2.1

  # Local Persistence & Offline Caching
  shared_preferences: ^2.2.3

  # UI, Icons & Theming
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
