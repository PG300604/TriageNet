databases:
  # -------------------------------------------------------------------------
  # TriageNet PostgreSQL Database (Managed)
  # -------------------------------------------------------------------------
  - name: triagenet-db
    databaseName: triagenet
    user: triagenet
    plan: free
    postgresMajorVersion: "16"

services:
  # -------------------------------------------------------------------------
  # TriageNet Spring Boot 3.3.13 Backend
  # -------------------------------------------------------------------------
  - type: web
    name: triagenet-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: triagenet-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: triagenet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: triagenet-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://triagenet-frontend.onrender.com,http://localhost:3000
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # -------------------------------------------------------------------------
  # TriageNet Next.js 16.4.1 Frontend
  # -------------------------------------------------------------------------
  - type: web
    name: triagenet-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://triagenet-backend.onrender.com/api
      - key: NODE_ENV
        value: production
